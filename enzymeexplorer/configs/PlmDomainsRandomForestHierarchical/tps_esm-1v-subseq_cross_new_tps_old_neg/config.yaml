# Track E: Train on new TPS + old negatives, evaluate on new dataset
# PlmDomainsRF: uses new-dataset domain features (covers new TPS).
# Old negatives have no detected domains — handled gracefully by defaultdict.
include: ../main_config.yaml
representations_path: "data/gathered_embs_esm-1v-finetuned-subseq_track_e_embs_avg.h5"
per_class_optimization: false
n_calls_hyperparams_opt: 350
id_col_name: "ID"
split_col_name: "Fold"
type_col_name: "Type"
seq_col_name: "Aminoacid_sequence"
tps_cleaned_csv_path: "data/track_e_new_tps_old_neg.csv"
domain_dist_path: "data/clustering__domain_dist_based_features_new_dataset.pkl"

eval_csv_path: "data/EnzymeExplorer_Dataset.csv"
eval_split_col_name: "Fold"
eval_id_col_name: "ID"
eval_representations_path: "data/gathered_embs_esm-1v-finetuned-subseq_new_dataset_embs_avg.h5"
