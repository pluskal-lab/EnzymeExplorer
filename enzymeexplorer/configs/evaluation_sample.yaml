# =============================================================================
# Sample evaluation config consumed by `enzyme_explorer_main evaluate`.
#
# Run with:
#   enzyme_explorer_main evaluate \
#     --config enzymeexplorer/configs/evaluation_sample.yaml \
#     --output-name <my_run_name>
#
# Outputs are written to outputs/evaluation_results/<my_run_name>/
#   ├── eval_config.yaml              (this file, copied for provenance)
#   ├── resolved_versions.yaml        (per-class version picks recorded)
#   ├── bootstrap_long.csv            (per-draw global metric values)
#   ├── point_estimates.csv           (full-data point estimates)
#   ├── jackknife.csv                 (leave-one-fold-out for BCa)
#   ├── summary.csv                   (point + ci_low + ci_high per metric)
#   ├── categories/<name>/...         (same files, sliced by category)
#   ├── threshold_sweep/<label>.csv   (per-version per-class APs)
#   └── plots/                        (populated by `visualize`)
# =============================================================================


# ---------------------------------------------------------------------------
# classifiers: which trained models / configs to evaluate.
# Each entry's KEY is a free-form display label used in plots and summary CSVs.
# Each value picks one (model, version) per class.
# ---------------------------------------------------------------------------
classifiers:

  # HBI baselines: the optimal version is class-dependent (selection.mode=auto).
  # Auto-discovery enumerates configs/<model>/<prefix>* dirs (skipping .ignore),
  # loads the latest run on disk per version, and picks the version that
  # maximises the chosen metric for each requested class.
  BLAST:
    model: Blastp                   # Python class name in enzymeexplorer.src.models
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection:
      mode: auto                    # auto | fixed
      prefix: eval                  # version dir name prefix to enumerate
      metric: ap                    # tie-breaker metric: ap | roc_auc

  HMM:
    model: HMM
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: auto, prefix: eval, metric: ap}

  Foldseek:
    model: Foldseek
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: auto, prefix: eval, metric: ap}

  # Pfam / SUPFAM only emit isTPS predictions, so request only the TPS class.
  PFAM:
    model: PfamSUPFAM
    classes: [TPS]
    selection: {mode: auto, prefix: pfam_bitscore, metric: ap}

  SUPFAM:
    model: PfamSUPFAM
    classes: [TPS]
    selection: {mode: auto, prefix: supfam_bitscore, metric: ap}

  # ML-family models use selection.mode=fixed: a single version covers every
  # class because the classifier is multi-output.
  PLM_Domains:
    model: PlmDomainsRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection:
      mode: fixed
      version: tps_esm-1v-subseq_with_minor_reactions_global_tuning

  PLM:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection:
      mode: fixed
      version: tps_esm-1v-subseq_with_minor_reactions_global_tuning

  Domains:
    model: DomainsRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection:
      mode: fixed
      version: with_minor_reactions_global_tuning

  # CLEAN: a single multi-class classifier; no per-class threshold tuning.
  # It participates only in the performance-comparison plots (bars, curves,
  # per-Kingdom / per-TPS-Type breakdowns). It is intentionally absent from
  # `prediction_thresholds` and `confidence_tiers` below since its score
  # distribution is not well-suited for precision-tier deployment.
  CLEAN:
    model: CLEAN
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection:
      mode: fixed
      version: with_minor_reactions

  # Add more EE-family or ablation models the same way; e.g.:
  # Domains:
  #   model: DomainsRandomForest
  #   classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  #   selection: {mode: fixed, version: with_minor_reactions_global_tuning}
  #
  # PLM:
  #   model: PlmRandomForest
  #   classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  #   selection: {mode: fixed, version: tps_esm-1v-subseq_with_minor_reactions_global_tuning}
  #
  # CLEAN:
  #   model: CLEAN
  #   classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  #   selection: {mode: fixed, version: with_minor_reactions}


# ---------------------------------------------------------------------------
# bootstrap: how to estimate confidence intervals over folds.
# ---------------------------------------------------------------------------
bootstrap:
  # Number of bootstrap draws. 1000 is the standard floor for stable
  # percentile CIs; raise to 2000+ for paper-grade BCa intervals.
  n_bootstraps: 1000

  # RNG seed. Same seed -> identical draws across runs.
  seed: 42

  # Resampling scheme:
  #   rows    - keep all 5 folds, resample rows within each fold with a
  #             per-fold seeded RNG, score per fold, average across folds.
  #             Narrower CIs (does not include fold-to-fold variance) — used
  #             for headline manuscript figures so significant differences
  #             between methods are visually distinguishable.
  #   cluster - per draw, resample fold IDs with replacement (size n_folds),
  #             then resample rows within each picked fold, score once on
  #             the pooled rows. Captures fold-to-fold variance honestly,
  #             but with only 5 folds the resulting CIs are very wide.
  mode: rows

  # Confidence level (two-sided, e.g. 0.95 = 95% CI).
  ci: 0.95

  # CI estimator from the bootstrap distribution:
  #   percentile - empirical alpha/2 and 1-alpha/2 quantiles. Standard,
  #                no parametric assumptions; default for this codebase.
  #   bca        - bias-corrected & accelerated, using leave-one-fold-out
  #                jackknife. Tighter when bootstrap distributions are skewed
  #                (common near AP=1). Recommended for final paper figures.
  ci_method: percentile

  # Metrics to compute per draw. Add others by extending bootstrap._safe_metric.
  metrics: [ap, roc_auc]


# ---------------------------------------------------------------------------
# aggregates: virtual classes derived by averaging metric values across the
# listed member classes within each draw. Each aggregate is only emitted for
# classifiers that cover all its members (so PFAM/SUPFAM, which have only
# TPS, do not get a Substrate_mAP row).
# ---------------------------------------------------------------------------
aggregates:
  Substrate_mAP: [FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  TPS_IDS_mAP:   [TPS, IDS]
  Overall_mAP:   [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]


# ---------------------------------------------------------------------------
# id_metadata: source CSV for per-ID metadata used by the `categories` block.
# Only required when `categories` is set.
# ---------------------------------------------------------------------------
id_metadata:
  csv: data/EnzymeExplorer_Dataset.csv


# ---------------------------------------------------------------------------
# categories (optional): run an additional per-category bootstrap pass.
# For each requested category C, the metric is computed on the slice
#   (id_to_category[ID] == C) | (id_to_category[ID] == negative_label)
# i.e. the category's positives plus the global negative pool. Comment out
# this block to skip categorical analysis entirely.
# ---------------------------------------------------------------------------
categories:
  Kingdom:
    column: Kingdom               # CSV column to read from id_metadata.csv
    # Leave `order` out to auto-discover all observed values (minus the
    # negative_label). Provide it to fix the visual ordering in plots.
    order: [Bacteria, Fungi, Plants, Animals, Protists, Archaea, Viruses]
    negative_label: Unknown       # which label denotes the negative pool

  TPS_Type:
    column: OriginalType
    order: [mono, sesq, di, sester, tri, tetra, hemi, sqs, psy, pt]
    negative_label: Unknown


# ---------------------------------------------------------------------------
# threshold_sweep (optional): pre-compute per-class AP across all candidate
# versions of a classifier so `visualize --plots threshold_sweep` can render
# the diagnostic line plots without recomputing. Each list entry produces one
# parquet under threshold_sweep/<label>.parquet.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# prediction_thresholds (optional): per-class score thresholds at chosen
# precision tiers, derived from pooled out-of-fold predictions. Useful for
# defining deployment confidence levels — e.g. "predictions ≥ T(99%) are
# high-confidence". Computed at `visualize` time, not during `evaluate`.
# Saved to prediction_thresholds.csv plus per-classifier heatmap plots.
# ---------------------------------------------------------------------------
prediction_thresholds:
  precisions: [0.99, 0.95, 0.90, 0.80, 0.70, 0.60, 0.50]
  classifiers: [PLM_Domains, PLM]    # ML models with continuous scores
  classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]


# ---------------------------------------------------------------------------
# confidence_tiers (optional): translate raw prediction scores into named
# confidence tiers for downstream deployment / inference. Each tier sets
# exactly one of:
#   * precision_target — lower_bound = smallest T such that precision of
#                        {score >= T} >= target
#   * recall_target    — lower_bound = largest T such that recall of
#                        {score >= T} >= target. Useful for the loosest
#                        tier (recall_target = 1.0 keeps every true
#                        positive above the Negative cutoff).
#
# Tiers whose target is unreachable for a class are absorbed into the
# next-stricter reachable tier — we never label a prediction with a tier
# we couldn't validate against held-out data.
#
# The future easy_predict module will call
# `confidence_tiers.apply_tiers_to_predictions(...)` on the raw model
# scores using the saved confidence_tiers.csv.
# ---------------------------------------------------------------------------
confidence_tiers:
  classifiers: [PLM_Domains, PLM]
  classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  tiers:
    - {name: "Very High Confidence", precision_target: 0.99, color: "#1a9850"}
    - {name: "High Confidence",      precision_target: 0.95, color: "#66bd63"}
    - {name: "Mid Confidence",       precision_target: 0.80, color: "#fee08b"}
    - {name: "Low Confidence",       precision_target: 0.50, color: "#fdae61"}
    - {name: "Very Low Confidence",  recall_target: 1.0,     color: "#f46d43"}


threshold_sweep:
  - label: BLAST                  # output filename stem and plot title
    model: Blastp                 # model class
    prefix: eval                  # version dir prefix to enumerate
    x_axis: neglog10              # neglog10 (eval1e-N -> N) | tail_int | categorical
    x_label: "E-value (-log10)"
    metric: ap                    # ap | roc_auc

  - label: HMM
    model: HMM
    prefix: eval
    x_axis: neglog10
    x_label: "E-value (-log10)"

  - label: Foldseek
    model: Foldseek
    prefix: eval
    x_axis: neglog10
    x_label: "E-value (-log10)"

  - label: PFAM
    model: PfamSUPFAM
    prefix: pfam_bitscore
    x_axis: tail_int              # parses trailing digits, e.g. pfam_bitscore25 -> 25
    x_label: "Bitscore"
    classes: [TPS]                # restrict the sweep to these classes

  - label: SUPFAM
    model: PfamSUPFAM
    prefix: supfam_bitscore
    x_axis: tail_int
    x_label: "Bitscore"
    classes: [TPS]
