# Shared visualize defaults for the four ablation eval configs
# (features, plm_plm_domains, ml_plm_domains, and any future ablation).
# Individual configs `include:` this file at the top level and then
# override with their own classifier_order / pin_last / ablation_xtick_overrides.
visualize:
  plots:
    - tps_detection
    - substrate_map
    - substrate_per_class
  metrics: [ap, roc_auc]
  palette_mode: ablation
  uniform_delta_color: "#80ceb9"
  bar_figsize: [2.2, 3.0]
  curve_figsize: [2.4, 2.4]
  curve_classes: [TPS]
  fixed_classifier_order: false
  auto_zoom:
    enabled: true
    delta_pct: 2.0
