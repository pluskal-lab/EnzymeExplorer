# ESM-2 layer ablation for PlmRandomForest.
# Three ESM-2 sizes (t30=150M, t33=650M, t36=3B), final 5 layers each.
# Same RF head as the main ablation; only the embedding source varies.

classifiers:
  PLM_Esm2_T30_L26:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L26}
  PLM_Esm2_T30_L27:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L27}
  PLM_Esm2_T30_L28:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L28}
  PLM_Esm2_T30_L29:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L29}
  PLM_Esm2_T30_L30:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L30}
  PLM_Esm2_T33_L29:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t33-L29}
  PLM_Esm2_T33_L30:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t33-L30}
  PLM_Esm2_T33_L31:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t33-L31}
  PLM_Esm2_T33_L32:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t33-L32}
  PLM_Esm2_T33_L33:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t33-L33}
  PLM_Esm2_T36_L32:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t36-L32}
  PLM_Esm2_T36_L33:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t36-L33}
  PLM_Esm2_T36_L34:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t36-L34}
  PLM_Esm2_T36_L35:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t36-L35}
  PLM_Esm2_T36_L36:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t36-L36}

bootstrap:
  n_bootstraps: 1000
  seed: 42
  mode: cluster
  ci: 0.95
  ci_method: normal
  metrics: [ap, roc_auc]
  # Reference classifier for delta plots: the t36-L36 variant (largest model, final layer).
  target_model: PLM_Esm2_T36_L36

aggregates:
  Substrate_mAP: [FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  TPS_IDS_mAP: [TPS, IDS]

visualize:
  plots:
    - tps_detection
    - substrate_map
    - substrate_per_class
    - pr_curves
    - roc_curves
    - pr_substrate
    - roc_substrate
  metric: ap
  curve_classes: [TPS]
  classifier_order:
    - PLM_Esm2_T30_L26
    - PLM_Esm2_T30_L27
    - PLM_Esm2_T30_L28
    - PLM_Esm2_T30_L29
    - PLM_Esm2_T30_L30
    - PLM_Esm2_T33_L29
    - PLM_Esm2_T33_L30
    - PLM_Esm2_T33_L31
    - PLM_Esm2_T33_L32
    - PLM_Esm2_T33_L33
    - PLM_Esm2_T36_L32
    - PLM_Esm2_T36_L33
    - PLM_Esm2_T36_L34
    - PLM_Esm2_T36_L35
    - PLM_Esm2_T36_L36
  fixed_classifier_order: true
  auto_zoom:
    enabled: true
    delta_pct: 2.0
  ablation_xtick_overrides:
    PLM_Esm2_T30_L26: "t30\nL26"
    PLM_Esm2_T30_L27: "t30\nL27"
    PLM_Esm2_T30_L28: "t30\nL28"
    PLM_Esm2_T30_L29: "t30\nL29"
    PLM_Esm2_T30_L30: "t30\nL30"
    PLM_Esm2_T33_L29: "t33\nL29"
    PLM_Esm2_T33_L30: "t33\nL30"
    PLM_Esm2_T33_L31: "t33\nL31"
    PLM_Esm2_T33_L32: "t33\nL32"
    PLM_Esm2_T33_L33: "t33\nL33"
    PLM_Esm2_T36_L32: "t36\nL32"
    PLM_Esm2_T36_L33: "t36\nL33"
    PLM_Esm2_T36_L34: "t36\nL34"
    PLM_Esm2_T36_L35: "t36\nL35"
    PLM_Esm2_T36_L36: "t36\nL36"
