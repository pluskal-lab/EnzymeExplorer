# PLM ablation for PlmRandomForest. Compares the embedding backbones on the
# same RF head. Six classifiers in a fixed order: ankh_base, ankh_large,
# esm-1v, esm-2, tps_ankh_base (Finetuned Ankh Base), tps_esm-1v-subseq
# (Finetuned ESM-1v).

classifiers:
  PLM_AnkhBase:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: ankh_base}
  PLM_AnkhLarge:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: ankh_large}
  PLM_Esm1v:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-1v}
  PLM_Esm2:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2}
  PLM_TpsAnkhBase:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: tps_ankh_base}
  PLM_TpsEsm1vSubseq:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: tps_esm-1v-subseq}

bootstrap:
  n_bootstraps: 1000
  seed: 42
  mode: cluster
  ci: 0.95
  ci_method: normal
  metrics: [ap, roc_auc]
  # Delta plots reference the main PLM-only classifier (Ankh Large). No
  # PlmDomainsRF entries in this config, so the target falls back to
  # PLM_AnkhLarge. Recorded deltas: (PLM_AnkhLarge - other).
  target_model: PLM_AnkhLarge

aggregates:
  Substrate_mAP: [FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  TPS_IDS_mAP: [TPS, IDS]

visualize:
  plots:
    - tps_detection
    - substrate_map
    - substrate_per_class
    - pr_curves
    - roc_curves
    - pr_substrate
    - roc_substrate
  metric: ap
  curve_classes: [TPS]
  classifier_order:
    - PLM_AnkhBase
    - PLM_AnkhLarge
    - PLM_Esm1v
    - PLM_Esm2
    - PLM_TpsAnkhBase
    - PLM_TpsEsm1vSubseq
  fixed_classifier_order: true
  auto_zoom:
    enabled: true
    delta_pct: 2.0
  ablation_xtick_overrides:
    PLM_AnkhBase: Ankh Base
    PLM_AnkhLarge: Ankh Large
    PLM_Esm1v: ESM-1v
    PLM_Esm2: ESM-2
    PLM_TpsAnkhBase: "Finetuned\n Ankh Base"
    PLM_TpsEsm1vSubseq: "Finetuned\n ESM-1v"
