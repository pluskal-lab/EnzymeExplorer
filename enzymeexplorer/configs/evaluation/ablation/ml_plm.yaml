# ML-models ablation for the PLM-only stack:
# PlmRandomForest vs PlmXgb vs PlmMLP, all on ankh_large.

classifiers:
  PLM_RF:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: ankh_large}
  PLM_Xgb:
    model: PlmXgb
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: ankh_large}
  PLM_MLP:
    model: PlmMLP
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: ankh_large}

bootstrap:
  n_bootstraps: 1000
  seed: 42
  mode: cluster
  ci: 0.95
  ci_method: normal
  metrics: [ap, roc_auc]

aggregates:
  Substrate_mAP: [FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  TPS_IDS_mAP: [TPS, IDS]

visualize:
  plots:
    - tps_detection
    - substrate_map
    - substrate_per_class
    - pr_curves
    - roc_curves
    - pr_substrate
    - roc_substrate
  metric: ap
  curve_classes: [TPS]
  classifier_order: [PLM_RF, PLM_Xgb, PLM_MLP]
  fixed_classifier_order: true
  auto_zoom:
    enabled: true
    delta_pct: 2.0
  ablation_xtick_overrides:
    PLM_RF: Random Forest
    PLM_Xgb: XGBoost
    PLM_MLP: MLP
