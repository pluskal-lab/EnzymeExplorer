# ESM-2 LAYER ablation for PlmRandomForest on the t30 base model.
# 5 classifiers, one per final layer (26..30).
# Same RF head, only the representation layer varies.

classifiers:
  PLM_Esm2_T30_L26:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L26}
  PLM_Esm2_T30_L27:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L27}
  PLM_Esm2_T30_L28:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L28}
  PLM_Esm2_T30_L29:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L29}
  PLM_Esm2_T30_L30:
    model: PlmRandomForest
    classes: [TPS, IDS, FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
    selection: {mode: fixed, version: esm-2-t30-L30}

bootstrap:
  n_bootstraps: 1000
  seed: 42
  mode: cluster
  ci: 0.95
  ci_method: normal
  metrics: [ap, roc_auc]
  # Reference classifier for delta plots: final layer of t30.
  target_model: PLM_Esm2_T30_L30

aggregates:
  Substrate_mAP: [FPP, GPP, GGPP, EDSQ, CPP, GFPP, 2xFPP, 2xGGPP]
  TPS_IDS_mAP: [TPS, IDS]

visualize:
  plots:
    - tps_detection
    - substrate_map
    - substrate_per_class
    - pr_curves
    - roc_curves
    - pr_substrate
    - roc_substrate
  metric: ap
  curve_classes: [TPS]
  classifier_order:
    - PLM_Esm2_T30_L26
    - PLM_Esm2_T30_L27
    - PLM_Esm2_T30_L28
    - PLM_Esm2_T30_L29
    - PLM_Esm2_T30_L30
  fixed_classifier_order: true
  auto_zoom:
    enabled: true
    delta_pct: 2.0
  ablation_xtick_overrides:
    PLM_Esm2_T30_L26: "L26"
    PLM_Esm2_T30_L27: "L27"
    PLM_Esm2_T30_L28: "L28"
    PLM_Esm2_T30_L29: "L29"
    PLM_Esm2_T30_L30: "L30"
