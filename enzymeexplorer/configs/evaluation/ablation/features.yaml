include: ../_defaults_visualize_ablation.yaml
classifiers:
  Domains:
    model: DomainsRandomForest
    classes:
    - TPS
    - IDS
    - FPP
    - GPP
    - GGPP
    - EDSQ
    - CPP
    - GFPP
    - 2xFPP
    - 2xGGPP
    selection:
      mode: fixed
      version: with_minor_reactions_global_tuning
  PLM:
    model: PlmRandomForest
    classes:
    - TPS
    - IDS
    - FPP
    - GPP
    - GGPP
    - EDSQ
    - CPP
    - GFPP
    - 2xFPP
    - 2xGGPP
    selection:
      mode: fixed
      version: ankh_large
  PLM_Domains:
    model: PlmDomainsRandomForest
    classes:
    - TPS
    - IDS
    - FPP
    - GPP
    - GGPP
    - EDSQ
    - CPP
    - GFPP
    - 2xFPP
    - 2xGGPP
    selection:
      mode: fixed
      version: ankh_large
bootstrap:
  n_bootstraps: 1000
  seed: 42
  mode: cluster
  ci: 0.95
  ci_method: bca
  metrics:
  - ap
  - roc_auc
  target_model: PLM_Domains
aggregates:
  Substrate_mAP:
  - FPP
  - GPP
  - GGPP
  - EDSQ
  - CPP
  - GFPP
  - 2xFPP
  - 2xGGPP
visualize:
  palette_mode: ablation
  classifier_order:
  - Domains
  - PLM
  - PLM_Domains
  pin_last: PLM_Domains
  ablation_xtick_overrides:
    Domains: Domains
    PLM: PLM
    PLM_Domains: 'PLM

      Domains'
  bar_plots:
    tps_detection:
      figsize:
      - 3
      - 2.0
      bar_width: 0.8
      xtic_rotation: 45
      xtick_fontsize: 8
      ytick_fontsize: 8
      title_fontsize: 12
    substrate_map:
      figsize:
      - 3
      - 2.0
      bar_width: 0.5
      xtick_fontsize: 8
      ytick_fontsize: 8
      title_fontsize: 12
    substrate_per_class:
      figsize:
      - 6.5
      - 2.0
      cluster_width: 0.8
      bar_width_frac: 0.92
      title_fontsize: 12
  delta_plots:
    figsize:
    - 2.0
    - 2.0
    box_width: 0.3
    xtick_fontsize: 8
    ytick_fontsize: 8
    title_fontsize: 12
